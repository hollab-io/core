name: hollab-core

services:
    # ── Infrastructure ───────────────────────────────────────────────────────────
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: hollab_indexing
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # ── Ponder indexer ───────────────────────────────────────────────────────────
    indexing-server:
        build:
            context: .
            dockerfile: Dockerfile
            target: indexing-server
        environment:
            DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/hollab_indexing
            DATABASE_SCHEMA: ponder
            PONDER_RPC_URL_1: ${PONDER_RPC_URL_1}
            START_BLOCK: ${START_BLOCK}
            HOLACRACY_DATA_PROVIDER_ADDRESS: ${HOLACRACY_DATA_PROVIDER_ADDRESS}
            ORGANIZATION_FACTORY_ADDRESS: ${ORGANIZATION_FACTORY_ADDRESS}
            HOL_GOVERNOR_FACTORY_ADDRESS: ${HOL_GOVERNOR_FACTORY_ADDRESS}
            MEETING_COMPONENTS_FACTORY_ADDRESS: ${MEETING_COMPONENTS_FACTORY_ADDRESS}
        ports:
            - "42069:42069"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - internal

    # ── Hola Modern (staging) ─────────────────────────────────────────────────
    hola-modern:
        build:
            context: .
            dockerfile: Dockerfile
            target: hola-modern
            args:
                VITE_DYNAMIC_ENVIRONMENT_ID: "aac79627-b466-4c2a-94e7-dad80d4746e7"
                VITE_INDEXER_URL: "https://indexer.hollab.io"
        restart: unless-stopped
        networks:
            - internal

    # ── Nginx ────────────────────────────────────────────────────────────────────
    nginx:
        image: nginx:1.27-alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - indexing-server
            - hola-modern
        restart: unless-stopped
        networks:
            - internal

volumes:
    postgres_data:

networks:
    internal:
        driver: bridge
